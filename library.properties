name=LoRa Local Network
version=0.1.0
author=Alvin Ahmad
maintainer=Alvin Ahmad
sentence=Bundled LoRa toolkit for local-first networks - RadioLib plus the classic LoRa API in a single Arduino library.
paragraph=RadioLib (SX127x, SX126x, SX128x, LR11x0, CC1101, RF69, nRF24, LoRaWAN, AX.25, RTTY, SSTV and more) merged with arduino-LoRa by Sandeep Mistry, so both <RadioLib.h> and <LoRa.h> work from one install. LoRaMac-node MAC sources are bundled under extras/mac for reference only and are never compiled.
category=Communication
architectures=*
includes=RadioLib.h,LoRa.h
