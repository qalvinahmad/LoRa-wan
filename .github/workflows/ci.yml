name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Packet codec unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run host unit tests
        run: extras/tests/run.sh

  compile-examples:
    name: Compile LocalNetwork examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/setup-arduino-cli@v2

      - name: Install toolchains
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile for Arduino Uno
        run: |
          for sk in LocalNetwork_Node LocalNetwork_Gateway; do
            echo "==> $sk @ arduino:avr:uno"
            arduino-cli compile --fqbn arduino:avr:uno --library . "examples/$sk"
          done

      - name: Compile for ESP32
        run: |
          for sk in LocalNetwork_Node LocalNetwork_Gateway; do
            echo "==> $sk @ esp32:esp32:esp32"
            arduino-cli compile --fqbn esp32:esp32:esp32 --library . "examples/$sk"
          done
